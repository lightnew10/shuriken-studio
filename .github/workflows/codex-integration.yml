name: Codex integration checks

on:
  push:
    branches:
      - feature/codex-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck-and-adapter-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck Electron and renderer
        run: npm run typecheck
      - name: Bundle Electron app
        run: npm run build
      - name: Run Codex adapter tests
        run: npx vitest run tests/codex-provider.test.ts
